name: Deploy gov-project-os

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Show toolchain
        run: |
          echo "node=$(node -v)"
          echo "pnpm=$(pnpm -v)"
          echo "OS=$(uname -a)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash
      - name: TypeScript check
        run: pnpm typecheck
        shell: bash
        continue-on-error: true
      - name: Lint
        run: pnpm lint
        shell: bash
        continue-on-error: true
      - name: Build Next.js
        run: pnpm build 2>&1 | tee /tmp/next-build.log
        shell: bash
      - name: Show Next.js build tail on failure
        if: failure()
        run: |
          echo "===== NEXT BUILD TAIL ====="
          tail -n 200 /tmp/next-build.log || true
        shell: bash
      - name: OpenNext build
        run: pnpm exec opennextjs-cloudflare build 2>&1 | tee /tmp/opennext-build.log
        shell: bash
      - name: Verify build output
        if: always()
        run: |
          echo "===== .open-next contents ====="
          ls -la .open-next 2>&1 || echo "no .open-next dir"
          echo "===== worker.js check ====="
          test -f .open-next/worker.js && echo "worker.js exists" || echo "worker.js MISSING"
          find .open-next -maxdepth 2 -type d 2>&1 | head -30
        shell: bash
      - name: Show OpenNext build tail on failure
        if: failure()
        run: |
          echo "===== OPENNEXT BUILD TAIL ====="
          tail -n 200 /tmp/opennext-build.log || true
        shell: bash
      - name: Package build output for artifact upload
        if: always()
        run: |
          set -e
          echo "Packaging .open-next into a single tarball..."
          tar -czf /tmp/opennext-build.tar.gz -C .open-next .
          echo "===== packaged artifact ====="
          ls -la /tmp/opennext-build.tar.gz
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: opennext-build
          path: /tmp/opennext-build.tar.gz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: /tmp/next-build.log
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opennext-build-log
          path: /tmp/opennext-build.log
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: opennext-build
          path: /tmp/opennext-build.tar.gz
      - name: Extract .open-next from artifact
        run: |
          set -e
          mkdir -p .open-next
          tar -xzf /tmp/opennext-build.tar.gz -C .open-next
          echo "===== extracted .open-next ====="
          ls -la .open-next | head -20
          test -f .open-next/worker.js && echo "worker.js OK" || (echo "worker.js MISSING"; exit 1)
        shell: bash
      - name: Publish Supabase URL and anon key
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://epudzahxpgmvnfdzahff.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwdWR6YWh4cGdtdm5mZHphaGZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NDk1MDUsImV4cCI6MjEwMzQyNTUwNX0.DTfPf1TVfEw5SBLhnnhfiXtb7whTyl2vSHFYSjH2EI0
        run: echo "vars configured"
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: https://epudzahxpgmvnfdzahff.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwdWR6YWh4cGdtdm5mZHphaGZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NDk1MDUsImV4cCI6MjEwMzQyNTUwNX0.DTfPf1TVfEw5SBLhnnhfiXtb7whTyl2vSHFYSjH2EI0

